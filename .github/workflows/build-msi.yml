name: Build MSI

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'WatermarkOverlay.sln'
      - '.github/workflows/build-msi.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ensure WiX Toolset is installed
        shell: powershell
        run: |
          choco upgrade wixtoolset --no-progress -y
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) { throw "WiX Toolset not found on PATH after install." }

      - name: Restore
        run: dotnet restore "src/WatermarkOverlay/WatermarkOverlay.csproj"

      - name: Build app (Release)
        run: dotnet build "src/WatermarkOverlay/WatermarkOverlay.csproj" -c Release --no-restore

      - name: Build MSI (Release)
        shell: cmd
        run: msbuild "WatermarkOverlay.sln" /p:Configuration=Release /m

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkOverlay-MSI
          path: |
            installer/WiX/bin/Release/*.msi
          if-no-files-found: error

