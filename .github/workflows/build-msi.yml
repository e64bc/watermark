name: Build MSI

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'WatermarkOverlay.sln'
      - '.github/workflows/build-msi.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset is installed
        shell: powershell
        run: |
          choco upgrade wixtoolset --no-progress -y
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) { throw "WiX Toolset not found on PATH after install." }

      - name: Restore
        run: dotnet restore "src/WatermarkOverlay/WatermarkOverlay.csproj"

      - name: Build app (Release, self-contained)
        shell: powershell
        run: |
          dotnet publish "src/WatermarkOverlay/WatermarkOverlay.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
          Write-Host "Publish output:"; Get-ChildItem -LiteralPath src/WatermarkOverlay/bin/Release/net8.0-windows/win-x64/publish -Force
          dotnet build "src/WatermarkConfigurator/WatermarkConfigurator.csproj" -c Release

      - name: Build MSI with WiX (Release)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $configuration = 'Release'
          $wxs = "installer/WiX/Product.wxs"
          $harvest = "installer/WiX/PublishFiles.wxs"
          $objDir = "installer/WiX/obj/$configuration"
          $binDir = "installer/WiX/bin/$configuration"
          $publishDir = (Resolve-Path -LiteralPath 'src/WatermarkOverlay/bin/Release/net8.0-windows/win-x64/publish').Path
          New-Item -ItemType Directory -Force -Path $objDir | Out-Null
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          # Harvest publish folder into a component group
          heat dir $publishDir `
            -cg PublishFiles `
            -dr INSTALLFOLDER `
            -srd -sreg -gg -sfrag -var var.PublishDir -out $harvest
          # Build the app first (already done above)
          # Compile .wxs -> .wixobj; pass Configuration var so paths resolve
          candle.exe -ext WixUtilExtension -dPublishDir="$publishDir" -out "$objDir/" $wxs $harvest
          # Link -> .msi; include NetFx extension if needed
          light.exe -ext WixNetFxExtension -ext WixUtilExtension -out "$binDir/WatermarkOverlay.msi" "$objDir/Product.wixobj" "$objDir/PublishFiles.wixobj"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkOverlay-MSI
          path: |
            installer/WiX/bin/Release/*.msi
          if-no-files-found: error

